# Separately versioned synthetic benchmark; never replaces final-audited results.
project:
  name: LFMT Experimental Signal Baselines
  version: experimental-v2.2
  random_seed: 2026
simulation:
  backend: fem
  spatial_resolution: {nx: 30, ny: 22, nz: 12}
  timestep_s: 0.1
  total_time_s: 14.0
geometry:
  plate: {length_mm: 100.0, width_mm: 70.0, thickness_mm: 2.3, material: mild_steel}
  inclusion:
    shape: cylinder
    center_x_mm: 50.0
    center_y_mm: 35.0
    depth_mm: 0.4
    diameter_mm: 8.0
    thickness_mm: 0.5
    material: welding_slag_silicate
excitation:
  type: linear_chirp
  f0_hz: 0.05
  f1_hz: 0.5
  duration_s: 10.0
  q0_w_m2: 5000.0
  ambient_temp_k: 293.15
  h_conv_w_m2k: 10.0
  emissivity: 0.95
camera:
  resolution_x: 32
  resolution_y: 32
  sampling_rate_hz: 10.0
  lens_fov_mm: [100.0, 70.0]
noise:
  snr_db: 30.0
  spatial_nonuniformity: 0.005
  emissivity_variation: 0.005
  seed: 2026
processing:
  pct: {n_components: 6, selection_criterion: blind_kurtosis}
  spct: {n_components: 6, alpha: 0.05, max_iter: 40}
  rpt: {n_components: 6, matrix_type: gaussian}
  detection: {threshold_method: adaptive_otsu, morphology_kernel_size: 3, min_area_px: 4}
