# Linear Frequency-Modulated Thermography (LFMT) Research Configuration
project:
  name: "LFMT Mild Steel Slag Detection"
  version: "0.1.0"
  random_seed: 42

simulation:
  backend: "finite_difference"  # "fem" (if FEniCSx/SfePy available) or "finite_difference"
  spatial_resolution:
    nx: 80
    ny: 56
    nz: 24
  timestep_s: 0.05
  total_time_s: 12.0

geometry:
  plate:
    length_mm: 100.0
    width_mm: 70.0
    thickness_mm: 2.3
    material: "mild_steel"
  inclusion:
    shape: "cylinder" # cylindrical disc inclusion
    center_x_mm: 50.0
    center_y_mm: 35.0
    depth_mm: 0.6
    diameter_mm: 8.0
    thickness_mm: 0.5
    material: "slag"

excitation:
  type: "linear_chirp"
  f0_hz: 0.05
  f1_hz: 0.50
  duration_s: 10.0
  q0_w_m2: 5000.0
  ambient_temp_k: 293.15
  h_conv_w_m2k: 10.0
  emissivity: 0.95

camera:
  resolution_x: 64
  resolution_y: 64
  sampling_rate_hz: 10.0
  lens_fov_mm: [100.0, 70.0]

noise:
  snr_db: null  # null (clean), 30, 25, 20
  spatial_nonuniformity: 0.005
  emissivity_variation: 0.005
  seed: 42

processing:
  pct:
    n_components: 6
    selection_criterion: "contrast" # "contrast", "snr", "blind_kurtosis"
  spct:
    n_components: 6
    alpha: 0.05
    max_iter: 200
  rpt:
    n_components: 6
    matrix_type: "gaussian" # "gaussian" or "sparse"
  matched_filter:
    normalize: true
    zero_pad: true
  detection:
    threshold_method: "adaptive_otsu"
    morphology_kernel_size: 3
    min_area_px: 4
