name: CI Test & Verification Suite

on:
  push:
    branches: [ main, master, research-v2, scientific-hardening-v3 ]
  pull_request:
    branches: [ main, master, research-v2, scientific-hardening-v3 ]

jobs:
  python-test:
    name: Python Scientific Suite (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[ci,tracking]" mypy==1.19.1

    - name: Strict typing (incremental scientific modules)
      run: python -m mypy --strict src/lfmt/advanced_processing.py src/lfmt/ml src/lfmt/experiment_tracking.py

    - name: Versioned dataset golden contract
      env:
        LFMT_GOLDEN_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: python -m pytest tests/test_dataset_contract.py -v

    - name: Run unit test suite (Portable non-MATLAB)
      run: |
        pytest -m "not matlab" -v

    - name: Run minimal smoke simulation test
      run: |
        python scripts/run_single_case.py --config configs/quick.yaml

    - name: Run quick mesh and timestep validation
      run: |
        python scripts/validate_mesh.py --quick
        python scripts/validate_timestep.py --quick

    - name: Run scientific results audit
      run: |
        python scripts/audit_conference_results.py

    - name: Run experiment results validation
      run: |
        python scripts/validate_experiment_results.py

    - name: Verify web data consistency
      run: |
        python scripts/verify_web_data.py

  container-benchmark:
    name: Pinned container and numerical canary
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build pinned scientific environment
      run: docker build --tag lfmt-benchmark:tier4 .
    - name: Reproduce versioned benchmark cases
      run: docker run --rm lfmt-benchmark:tier4
    - name: Check golden dataset contract inside container
      run: docker run --rm lfmt-benchmark:tier4 python -m pytest tests/test_dataset_contract.py -v

  web-build:
    name: Next.js Web Portal CI
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: web/package-lock.json

    - name: Install dependencies
      run: |
        cd web
        npm ci

    - name: TypeScript typecheck
      run: |
        cd web
        npm run typecheck

    - name: ESLint static analysis
      run: |
        cd web
        npm run lint

    - name: Next.js production build
      run: |
        cd web
        npm run build
