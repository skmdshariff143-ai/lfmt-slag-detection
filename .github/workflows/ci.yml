name: CI Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run unit test suite
      run: |
        pytest -v --cov=lfmt --cov-report=xml

    - name: Run minimal smoke simulation test
      run: |
        python scripts/run_single_case.py --config configs/quick.yaml

    - name: Run quick validation tests
      run: |
        python scripts/validate_mesh.py --quick
        python scripts/validate_timestep.py --quick
