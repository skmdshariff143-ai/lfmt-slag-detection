camera:
  lens_fov_mm:
  - 100.0
  - 70.0
  resolution_x: 128
  resolution_y: 128
  sampling_rate_hz: 25.0
excitation:
  ambient_temp_k: 293.15
  duration_s: 10.0
  emissivity: 0.95
  f0_hz: 0.05
  f1_hz: 0.5
  h_conv_w_m2k: 10.0
  q0_w_m2: 5000.0
  type: linear_chirp
geometry:
  inclusion:
    center_x_mm: 50.0
    center_y_mm: 35.0
    depth_mm: 0.6
    diameter_mm: 8.0
    material: slag
    shape: cylinder
    thickness_mm: 0.5
  plate:
    length_mm: 100.0
    material: mild_steel
    thickness_mm: 2.3
    width_mm: 70.0
noise:
  emissivity_variation: 0.005
  seed: 42
  snr_db: 25.0
  spatial_nonuniformity: 0.005
processing:
  detection:
    evaluation_tier: tier_a
    min_area_px: 4
    morphology_kernel_size: 3
    multi_defect_mode: false
    threshold_method: adaptive_otsu
  matched_filter:
    normalize: true
    zero_pad: true
  pct:
    n_components: 6
    selection_criterion: contrast
  rpt:
    matrix_type: gaussian
    n_components: 6
  spct:
    alpha: 0.05
    max_iter: 40
    n_components: 6
project:
  name: LFMT Conference Benchmark Corrected
  random_seed: 42
  version: conference-v1.1-corrected
simulation:
  backend: fem
  spatial_resolution:
    nx: 100
    ny: 70
    nz: 30
  timestep_s: 0.04
  total_time_s: 14.0
