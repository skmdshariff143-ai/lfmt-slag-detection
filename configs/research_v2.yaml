# ==============================================================================
# CANONICAL RESEARCH V2 CONFIGURATION FILE
# Linear Frequency-Modulated Infrared Thermography for Slag Detection in Mild Steel
# ==============================================================================

project:
  name: "LFMT Slag Detection Research V2"
  version: "0.2.0-research-v2"
  random_seed: 42

simulation:
  backend: "fem"  # "fem" (Primary) or "finite_difference" (Cross-check)
  spatial_resolution:
    nx: 80
    ny: 56
    nz: 24
  timestep_s: 0.05
  total_time_s: 12.0
  mesh_refinement:
    mode: "adaptive_tensor"  # "uniform", "adaptive_tensor", "coarse", "medium", "fine", "very_fine"
    target_elements_across_diameter: 8
    target_elements_through_depth: 4
    grading_factor: 1.3

geometry:
  plate:
    length_mm: 100.0
    width_mm: 70.0
    thickness_mm: 2.3
    material: "mild_steel_1018"
    thermal_conductivity: 51.9
    density: 7850.0
    specific_heat: 486.0
  inclusion:
    shape: "cylinder"  # "cylinder", "ellipse", "strip", "irregular", "multi"
    center_x_mm: 50.0
    center_y_mm: 35.0
    depth_mm: 0.6
    diameter_mm: 8.0
    major_axis_mm: 8.0
    minor_axis_mm: 8.0
    orientation_deg: 0.0
    thickness_mm: 0.5
    material: "welding_slag_silicate"
    thermal_conductivity: 1.20
    density: 2800.0
    specific_heat: 850.0
    seed: 42
    contact_resistance:
      enabled: false
      h_contact_w_m2k: 10000.0
  weld:
    enabled: false  # Optional weld bead / HAZ simulation
    weld_bead_width_mm: 12.0
    weld_bead_thickness_mm: 0.5
    haz_width_mm: 4.0
    weld_centerline_x_mm: 50.0

excitation:
  type: "linear_chirp"
  f0_hz: 0.05
  f1_hz: 0.50
  duration_s: 10.0
  q0_w_m2: 5000.0
  ambient_temp_k: 293.15
  h_conv_w_m2k: 10.0
  emissivity: 0.95
  heating_profile:
    type: "uniform"  # "uniform", "gaussian_centered", "gaussian_offaxis", "linear_gradient"
    center_x_mm: 50.0
    center_y_mm: 35.0
    sigma_x_mm: 30.0
    sigma_y_mm: 25.0
    gradient_slope_x: 0.0

camera:
  resolution_x: 64
  resolution_y: 64
  sampling_rate_hz: 10.0
  lens_fov_mm: [100.0, 70.0]
  model_tier: "v2_realistic"  # "v1_ideal" or "v2_realistic"
  netd_mK: 25.0
  psf_sigma_px: 0.5
  integration_time_ms: 5.0
  adc_bits: 14
  fpn_factor: 0.002
  drift_rate_k_per_s: 0.001
  emissivity_model: "radiance_planck_v2"  # "simplified_kelvin_v1" or "radiance_planck_v2"
  background_reflected_temp_k: 293.15

noise:
  preset: "CONTROLLED_AWGN"  # "IDEAL", "CONTROLLED_AWGN", "REALISTIC_CAMERA_NOISE"
  snr_db: 30.0
  spatial_nonuniformity: 0.005
  emissivity_variation: 0.005
  seed: 42

material_uncertainty:
  enabled: false
  k_slag_range: [1.0, 1.4]
  rho_slag_range: [2600.0, 3000.0]
  cp_slag_range: [750.0, 950.0]
  k_steel_range: [48.0, 55.0]
  cp_steel_range: [460.0, 510.0]
  sampling_method: "latin_hypercube"
  seed: 42

processing:
  pct:
    n_components: 6
    selection_criterion: "blind_kurtosis"
  spct:
    n_components: 6
    alpha: 0.05
    max_iter: 200
  rpt:
    n_components: 6
    matrix_type: "gaussian"
  matched_filter:
    normalize: true
    zero_pad: true
    use_delay_map: false
  detection:
    threshold_method: "adaptive_otsu"
    morphology_kernel_size: 3
    min_area_px: 4
    multi_defect_mode: false
    evaluation_tier: "tier_a"
